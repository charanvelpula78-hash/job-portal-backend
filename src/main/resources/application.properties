server.port=8080

# ---- MySQL (change username/password to match your machine) ----
spring.datasource.url=jdbc:mysql://localhost:3306/job_portal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- File upload (resumes) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

# ---- JWT (secret must be at least 32 characters) ----
app.jwt.secret=change-this-to-a-long-random-secret-key-for-jwt-signing-123456
app.jwt.expiration-ms=86400000

# ---- CORS: React dev server ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- Default admin (created on first start if missing) ----
app.admin.email=admin@jobportal.com
app.admin.password=Admin@123
